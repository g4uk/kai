<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Harness Kit — Performance</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..800&family=IBM+Plex+Mono:wght@400;500&display=swap');

* { box-sizing: border-box; }
body { margin: 0; }

.hk-root {
  --paper:#E8EAE2; --card:#F6F7F1; --ink:#22261F; --dim:#6A7060;
  --line:#C7CCBB; --tape:#D99A06; --tape-soft:#F3D488; --ok:#1E8449; --bad:#A2402E;
  --series2:#2A78D6;
  --ply1:#DBC69C; --ply2:#B99B69;
  min-height:100vh; background:var(--paper); color:var(--ink);
  font-family:'Archivo',system-ui,sans-serif; font-stretch:87%;
  max-width:880px; margin:0 auto; padding:20px 16px 48px;
}
.hk-mono { font-family:'IBM Plex Mono',monospace; }

.hk-title { display:flex; justify-content:space-between; align-items:flex-end;
  border:2px solid var(--ink); background:var(--card); padding:12px 14px; }
.hk-logo { font-weight:800; font-size:26px; letter-spacing:.04em; font-stretch:75%; }
.hk-title-sub { display:block; font-size:12px; color:var(--dim); margin-top:2px; }
.hk-stamp { display:flex; flex-direction:column; align-items:flex-end; gap:2px;
  font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--dim);
  border-left:1px solid var(--line); padding-left:12px; }

.hk-tabs { display:flex; gap:6px; margin-top:14px; }
.hk-tabs-sub { margin-top:0; margin-bottom:14px; }
.hk-tab { flex:1; text-align:left; background:transparent; border:1px solid var(--line);
  border-bottom:2px solid var(--line); padding:8px 10px; cursor:pointer; color:var(--ink);
  font:inherit; transition:background .15s; }
.hk-tab:hover { background:var(--card); }
.hk-tab.active { background:var(--card); border-color:var(--ink); border-bottom:3px solid var(--tape); }
.hk-tab-name { display:block; font-weight:700; font-size:15px; }
.hk-tab-sub { display:block; font-size:11px; color:var(--dim); }
.hk-tab-pct { display:block; margin-top:4px; font-family:'IBM Plex Mono',monospace;
  font-size:12px; color:var(--dim); }
.hk-tab.active .hk-tab-pct { color:var(--tape); font-weight:500; }

.hk-progress { margin-top:16px; }
.hk-ply { height:22px; border:1.5px solid var(--ink); background:var(--card); overflow:hidden; }
.hk-ply-fill { height:100%;
  background:repeating-linear-gradient(90deg,
    var(--ply1) 0 10px, var(--ply2) 10px 13px, #EADFC6 13px 22px, var(--ply2) 22px 25px);
  border-right:2px solid var(--ink); transition:width .35s ease; }
.hk-progress-meta { display:flex; justify-content:space-between; font-size:12px;
  color:var(--dim); margin-top:4px; }

.hk-phase { margin-top:20px; background:var(--card); border:1px solid var(--line); }
.hk-phase-head { display:flex; justify-content:space-between; align-items:baseline;
  font-size:14px; font-weight:700; letter-spacing:.02em; text-transform:uppercase;
  margin:0; padding:10px 12px; border-bottom:1px solid var(--line); }
.hk-phase-count { font-size:11px; color:var(--dim); font-weight:400; }

.hk-row { display:flex; align-items:flex-start; gap:10px; padding:9px 12px;
  border-bottom:1px dashed var(--line); cursor:pointer; }
.hk-row:last-child { border-bottom:none; }
.hk-row:hover { background:#EFF1E8; }
.hk-row input { margin-top:3px; width:15px; height:15px; accent-color:var(--ok); flex:none; }
.hk-row-id { font-size:11px; color:var(--dim); margin-top:2px; flex:none; width:38px; }
.hk-row-text { font-size:14px; line-height:1.4; }
.hk-row.done .hk-row-text { color:var(--dim); text-decoration:line-through;
  text-decoration-color:var(--ok); text-decoration-thickness:1.5px; }

/* performance: summary cards */
.hk-cards { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:16px; }
.hk-card { background:var(--card); border:1px solid var(--line); padding:12px 10px; text-align:center; }
.hk-card-num { display:block; font-family:'IBM Plex Mono',monospace; font-size:22px; font-weight:500; }
.hk-card-label { display:block; font-size:10.5px; color:var(--dim); text-transform:uppercase;
  letter-spacing:.03em; margin-top:4px; }

/* performance: bar charts */
.hk-chart { padding:10px 12px; display:flex; flex-direction:column; gap:6px; }
.hk-bar-row { display:flex; align-items:center; gap:8px; }
.hk-bar-label { width:44px; flex:none; font-size:11px; color:var(--dim); }
.hk-bar-track { flex:1; height:14px; background:#fff; border:1px solid var(--line); overflow:hidden; }
.hk-bar-fill { height:100%; background:var(--tape); min-width:2px; }
.hk-bar-val { width:52px; flex:none; text-align:right; font-size:12px; }

/* performance: first-pass strip */
.hk-fp-strip { padding:12px; display:flex; flex-wrap:wrap; gap:5px; }
.hk-fp-dot { width:14px; height:14px; border:1px solid var(--ink); flex:none; }
.hk-fp-dot.yes { background:var(--ok); }
.hk-fp-dot.no { background:var(--bad); }

/* performance: cost-vs-minutes scatter */
.hk-scatter-wrap { padding:10px 12px 0; }
.hk-scatter { width:100%; height:auto; display:block; }
.hk-axis { stroke:var(--line); stroke-width:1; }
.hk-axis-label { fill:var(--dim); font-family:'IBM Plex Mono',monospace; font-size:9px; }
.hk-line { fill:none; stroke-width:2; }
.hk-line-cost { stroke:var(--tape); }
.hk-line-mins { stroke:var(--series2); }
.hk-vertex { stroke:var(--card); stroke-width:2; }
.hk-vertex-cost { fill:var(--tape); }
.hk-vertex-mins { fill:var(--series2); }
.hk-legend { display:flex; gap:14px; padding:8px 12px 12px; font-size:11.5px; color:var(--dim); }
.hk-legend-item { display:flex; align-items:center; gap:5px; }
.hk-legend-line { width:14px; height:0; border-top:2px solid; flex:none; }
.hk-legend-line-cost { border-color:var(--tape); }
.hk-legend-line-mins { border-color:var(--series2); }

/* performance: first-half vs second-half */
.hk-cmp { display:flex; align-items:center; gap:14px; padding:14px 12px; }
.hk-cmp-col { flex:1; }
.hk-cmp-col h3 { margin:0 0 4px; font-size:12px; text-transform:uppercase; color:var(--dim); }
.hk-cmp-col p { margin:0; font-size:14px; }
.hk-cmp-arrow { font-size:20px; color:var(--dim); flex:none; }

.hk-empty { margin-top:20px; padding:20px 16px; background:var(--card); border:1px dashed var(--line);
  color:var(--dim); font-size:14px; line-height:1.5; }

.hk-table-wrap { overflow-x:auto; }
.hk-table { width:100%; border-collapse:collapse; font-size:12.5px; }
.hk-table th { text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em;
  color:var(--dim); padding:6px 8px; border-top:1px solid var(--line);
  border-bottom:1px solid var(--line); }
.hk-table td { padding:6px 8px; border-bottom:1px dashed var(--line); vertical-align:top; }
.hk-table .num { text-align:right; }
.hk-note { max-width:260px; color:var(--dim); font-size:12px; }
.hk-approach { max-width:200px; color:var(--dim); font-size:12px; overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap; }

.hk-ref { margin-top:22px; }
.hk-ref-toggle { font:inherit; font-size:13px; background:none; border:none; color:var(--ink);
  text-decoration:underline; text-underline-offset:3px; cursor:pointer; padding:0; }
.hk-ref-toggle:focus-visible, .hk-tab:focus-visible { outline:2px solid var(--ink); outline-offset:2px; }
.hk-inv { margin:10px 0 0; padding:12px 14px 12px 34px; background:var(--card);
  border:1px solid var(--line); font-size:13.5px; line-height:1.5; }
.hk-inv li { margin-bottom:6px; }
.hk-inv li::marker { font-family:'IBM Plex Mono',monospace; color:var(--tape); font-weight:500; }

.hk-foot { margin-top:26px; font-size:12px; color:var(--dim); border-top:1px solid var(--line);
  padding-top:10px; }

@media (max-width:560px) {
  .hk-tabs { flex-direction:column; }
  .hk-tab { display:flex; align-items:baseline; gap:8px; }
  .hk-tab-pct { margin-top:0; margin-left:auto; }
  .hk-stamp { display:none; }
  .hk-cards { grid-template-columns:repeat(2,1fr); }
}
@media (prefers-reduced-motion:reduce) {
  .hk-ply-fill { transition:none; }
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/plain" id="hk-source">
const { useState } = React;

/* Filled in at build time by build/dashboard.sh from docs/metrics.md.
   Left untouched, this stays a valid empty array — the template renders
   with an empty-state message on its own. */
const METRICS_DATA = /*__METRICS_JSON__*/ [];

/* ------------------------------------------------------------------ */
/* Data: checklists for the three scenarios (from harness-kit/scenarios/) */
/* ------------------------------------------------------------------ */

const SCENARIOS = {
  greenfield: {
    label: "Greenfield",
    sub: "your project from scratch",
    phases: [
      {
        title: "Stage 0 — Foundation",
        items: [
          "docs/decisions.md — every decision in writing",
          "CLAUDE.md derived from decisions + YAGNI gate",
          "install.sh → .claude/, hooks active from commit #1",
          "docs/metrics.md in place",
        ],
      },
      {
        title: "Stage 1 — Walking skeleton",
        items: [
          "Feature #0: end-to-end slice deployed (/harness:spec → /harness:plan → /harness:verify)",
          "CI + plan-verifier from PR #1",
          "Trace #0 in harness/evals/traces/",
        ],
      },
      {
        title: "Stage 2 — Vertical slices",
        items: [
          "3–5 features as vertical slices only",
          "/harness:retro after EVERY merge",
          "Skills born from retro repeats",
          "metrics.md with a LOC diff column",
        ],
      },
      {
        title: "Stage 3 — Agents & evals",
        items: [
          "5 subagents + dispatch matrix",
          "Evals baseline from accumulated traces",
          "MCP at first external state + token audit",
        ],
      },
      {
        title: "Stage 4 — Scale",
        items: [
          "fan-out ×3 on the first mechanical migration",
          "Plugin at the second person / second repo",
          "Recurring digest from an agent",
        ],
      },
    ],
  },
  onboarding: {
    label: "Onboarding",
    sub: "someone else's existing project",
    phases: [
      {
        title: "Stage 0 — Access & personal gates",
        items: [
          "Access, local run, test suite passes",
          "journal.md + metrics.md outside the repo",
          "guard.sh in ~/.claude BEFORE the first session",
          "Read existing .claude/ and CLAUDE.md; token-audit others' MCP",
        ],
      },
      {
        title: "Stage 1 — Recon",
        items: [
          "2 researcher sessions: high-level map + critical flows",
          "\"ASSUMPTIONS\" verified with humans",
          "surface-map.md (personal, outside the repo)",
        ],
      },
      {
        title: "Stage 2 — First cycle",
        items: [
          "CLAUDE.local.md (verified facts only!)",
          "First PR through the full cycle: branch → review → merge → deploy",
          "Review remarks → \"How things are done here\"",
        ],
      },
      {
        title: "Stage 3 — Personal harness",
        items: [
          "3 personal skills from real cases",
          "researcher + pr-preflight; no PR without preflight",
          "Personal dispatch matrix: where the agent can be trusted",
        ],
      },
      {
        title: "Stage 4 — Depth",
        items: [
          "Critical modules explained in your own words",
          "First contribution: README fix or surface-map as a docs/ PR",
        ],
      },
      {
        title: "Stage 5 — Legitimization",
        items: [
          "Team CLAUDE.md as a PR with perception-gap numbers",
          "Then one PR at a time: skills → fmt-hook → guard-hook",
        ],
      },
    ],
  },
  existing: {
    label: "Existing",
    sub: "your own existing project",
    phases: [
      {
        title: "Stage 1 — Perception gap",
        items: [
          "Audit: 10 questions without CLAUDE.md, scored table",
          "docs/surface-map.md",
          "CLAUDE.md against specific failures; re-audit ≥8/10",
          "install.sh → .claude/, skills filled in (EDIT_ME)",
          "Skill triggering test 10/10",
        ],
      },
      {
        title: "Stage 2 — Topology & MCP",
        items: [
          "5 agents + dispatch matrix",
          "One task ×3 topologies → topology report with numbers",
          "MCP token audit, greedy servers disabled, hybrid Skill+MCP",
        ],
      },
      {
        title: "Stage 3 — Quality gates",
        items: [
          "Feature through the full cycle + cost.md + /harness:retro",
          "3 hooks hand-tested (exit 2!)",
          "plan-verifier in CI",
          "20 traces + baseline; mutation report",
        ],
      },
      {
        title: "Stage 4 — Scale",
        items: [
          "fan-out ×3: playbook → fanout-log → cost delta",
          "Plugin + CI auto-review + staged rollout plan",
        ],
      },
    ],
  },
};

const INVARIANTS = [
  "Phase by phase: perceive → spec → plan → implement → verify. Every phase is a reviewable file.",
  "Safety lives in permissions + hooks (exit 2), not prompts. A prompt is a wish; a gate is a guarantee.",
  "A subagent returns a condensed result. Small tasks skip subagents.",
  "Metrics from day one: /cost → the log. Without numbers, decisions are religion.",
  "/harness:retro after every merge feeds CLAUDE.md, skills, and evals.",
  "Changing CLAUDE.md/skills without an eval run = code without tests.",
];

/* ------------------------------------------------------------------ */

const CHECKS_KEY = "harness:checks:v1";
const itemId = (sc, p, i) => `${sc}.${p}.${i}`;

function loadChecks() {
  try {
    return JSON.parse(localStorage.getItem(CHECKS_KEY) || "{}");
  } catch {
    return {};
  }
}
function saveChecks(next) {
  try {
    localStorage.setItem(CHECKS_KEY, JSON.stringify(next));
  } catch (e) {
    console.error("save failed", e);
  }
}

const avg = (arr) => (arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : 0);

/* ------------------------------------------------------------------ */

function BarRow({ label, value, max, suffix }) {
  const pct = max > 0 ? Math.max(2, Math.round((value / max) * 100)) : 0;
  return (
    <div className="hk-bar-row">
      <span className="hk-bar-label hk-mono">{label}</span>
      <div className="hk-bar-track">
        <div className="hk-bar-fill" style={{ width: pct + "%" }} />
      </div>
      <span className="hk-bar-val hk-mono">
        {value}
        {suffix || ""}
      </span>
    </div>
  );
}

function summarize(rows) {
  const withCost = rows.filter((m) => m.cost > 0);
  return {
    cost: avg(withCost.map((m) => m.cost)),
    fp: rows.length ? Math.round((rows.filter((m) => m.firstPass).length / rows.length) * 100) : 0,
    mins: avg(rows.map((m) => m.mins)),
  };
}

function IndexedTrend({ data }) {
  const points = data.filter((m) => m.cost > 0);
  if (points.length < 2) return null;

  const W = 480,
    H = 220,
    PAD_L = 34,
    PAD_R = 14,
    PAD_T = 14,
    PAD_B = 26;
  const innerW = W - PAD_L - PAD_R;
  const innerH = H - PAD_T - PAD_B;
  const maxCost = Math.max(...points.map((m) => m.cost));
  const maxMins = Math.max(...points.map((m) => m.mins), 1);
  const n = points.length;
  const stepX = n > 1 ? innerW / (n - 1) : 0;
  const xAt = (i) => PAD_L + i * stepX;
  const yAt = (pct) => PAD_T + innerH - (pct / 100) * innerH;

  const costPts = points.map((m, i) => [xAt(i), yAt((m.cost / maxCost) * 100)]);
  const minsPts = points.map((m, i) => [xAt(i), yAt((m.mins / maxMins) * 100)]);
  const path = (pts) => pts.map(([px, py], i) => (i === 0 ? "M" : "L") + px.toFixed(1) + "," + py.toFixed(1)).join(" ");

  return (
    <section className="hk-phase">
      <h2 className="hk-phase-head">
        <span>Cost &amp; human minutes, indexed</span>
        <span className="hk-mono hk-phase-count">each series % of its own max — one shared axis</span>
      </h2>
      <div className="hk-scatter-wrap">
        <svg
          viewBox={`0 0 ${W} ${H}`}
          className="hk-scatter"
          role="img"
          aria-label="Cost and human minutes per feature, each indexed to percent of its own maximum"
        >
          <line x1={PAD_L} y1={yAt(0)} x2={W - PAD_R} y2={yAt(0)} className="hk-axis" />
          <line x1={PAD_L} y1={yAt(100)} x2={W - PAD_R} y2={yAt(100)} className="hk-axis" />
          <text x={PAD_L - 6} y={yAt(0) + 3} textAnchor="end" className="hk-axis-label">
            0%
          </text>
          <text x={PAD_L - 6} y={yAt(100) + 3} textAnchor="end" className="hk-axis-label">
            100%
          </text>
          <path d={path(costPts)} className="hk-line hk-line-cost" />
          <path d={path(minsPts)} className="hk-line hk-line-mins" />
          {points.map((m, i) => (
            <circle key={"c" + i} cx={costPts[i][0]} cy={costPts[i][1]} r="5" className="hk-vertex hk-vertex-cost">
              <title>
                {m.task}: ${m.cost.toFixed(2)}
                {m.approxCost ? " (approx)" : ""}
              </title>
            </circle>
          ))}
          {points.map((m, i) => (
            <circle key={"m" + i} cx={minsPts[i][0]} cy={minsPts[i][1]} r="5" className="hk-vertex hk-vertex-mins">
              <title>
                {m.task}: {m.mins}m
              </title>
            </circle>
          ))}
          {points.map((m, i) => (
            <text key={"l" + i} x={xAt(i)} y={H - 8} textAnchor="middle" className="hk-axis-label">
              {m.date.slice(5)}
            </text>
          ))}
        </svg>
      </div>
      <div className="hk-legend">
        <span className="hk-legend-item">
          <span className="hk-legend-line hk-legend-line-cost" />
          cost (max ${maxCost.toFixed(2)})
        </span>
        <span className="hk-legend-item">
          <span className="hk-legend-line hk-legend-line-mins" />
          human min (max {Math.round(maxMins)}m)
        </span>
      </div>
    </section>
  );
}

function Performance({ data }) {
  if (data.length === 0) {
    return (
      <div className="hk-empty">
        No entries in docs/metrics.md yet. Log a feature with /harness:log-metrics
        after a retro, then rebuild: <span className="hk-mono">./build/dashboard.sh</span>
      </div>
    );
  }

  const n = data.length;
  const totalCost = data.filter((m) => m.cost > 0).reduce((a, m) => a + m.cost, 0);
  const overall = summarize(data);
  const maxCost = Math.max(1, ...data.map((m) => m.cost));
  const maxMins = Math.max(1, ...data.map((m) => m.mins));

  const half = Math.floor(n / 2);
  const c1 = summarize(data.slice(0, half));
  const c2 = summarize(data.slice(half));

  return (
    <>
      <section className="hk-cards">
        <div className="hk-card">
          <span className="hk-card-num">{n}</span>
          <span className="hk-card-label">features logged</span>
        </div>
        <div className="hk-card">
          <span className="hk-card-num">${overall.cost.toFixed(2)}</span>
          <span className="hk-card-label">avg cost / feature</span>
        </div>
        <div className="hk-card">
          <span className="hk-card-num">{overall.fp}%</span>
          <span className="hk-card-label">first-pass rate</span>
        </div>
        <div className="hk-card">
          <span className="hk-card-num">{Math.round(overall.mins)}</span>
          <span className="hk-card-label">avg human min</span>
        </div>
      </section>

      <section className="hk-phase">
        <h2 className="hk-phase-head">
          <span>Cost per feature</span>
          <span className="hk-mono hk-phase-count">total ${totalCost.toFixed(2)}</span>
        </h2>
        <div className="hk-chart">
          {data.map((m, i) => (
            <BarRow key={i} label={m.date.slice(5)} value={Number(m.cost.toFixed(2))} max={maxCost} />
          ))}
        </div>
      </section>

      <section className="hk-phase">
        <h2 className="hk-phase-head">
          <span>Human minutes per feature</span>
        </h2>
        <div className="hk-chart">
          {data.map((m, i) => (
            <BarRow key={i} label={m.date.slice(5)} value={m.mins} max={maxMins} suffix="m" />
          ))}
        </div>
      </section>

      <IndexedTrend data={data} />

      <section className="hk-phase">
        <h2 className="hk-phase-head">
          <span>First-pass, chronological</span>
          <span className="hk-mono hk-phase-count">green = first-pass, red = rework</span>
        </h2>
        <div className="hk-fp-strip">
          {data.map((m, i) => (
            <span
              key={i}
              className={"hk-fp-dot" + (m.firstPass ? " yes" : " no")}
              title={m.date + " — " + m.task}
            />
          ))}
        </div>
      </section>

      {n >= 4 && (
        <section className="hk-phase">
          <h2 className="hk-phase-head">
            <span>First half vs second half</span>
            <span className="hk-mono hk-phase-count">retro compounding check</span>
          </h2>
          <div className="hk-cmp">
            <div className="hk-cmp-col">
              <h3>First {half}</h3>
              <p>
                ${c1.cost.toFixed(2)} avg · {c1.fp}% first-pass · {Math.round(c1.mins)}m avg
              </p>
            </div>
            <div className="hk-cmp-arrow">→</div>
            <div className="hk-cmp-col">
              <h3>Last {n - half}</h3>
              <p>
                ${c2.cost.toFixed(2)} avg · {c2.fp}% first-pass · {Math.round(c2.mins)}m avg
              </p>
            </div>
          </div>
        </section>
      )}

      <section className="hk-phase">
        <h2 className="hk-phase-head">
          <span>All entries</span>
        </h2>
        <div className="hk-table-wrap">
          <table className="hk-table">
            <thead>
              <tr>
                <th>date</th>
                <th>task</th>
                <th>approach</th>
                <th className="num">$</th>
                <th>1st</th>
                <th className="num">min</th>
                <th>note</th>
              </tr>
            </thead>
            <tbody>
              {[...data].reverse().map((m, i) => (
                <tr key={i}>
                  <td className="hk-mono">{m.date.slice(5)}</td>
                  <td>{m.task}</td>
                  <td className="hk-approach" title={m.approach}>{m.approach}</td>
                  <td className="num hk-mono">
                    {m.approxCost ? "~" : ""}
                    {m.cost.toFixed(2)}
                  </td>
                  <td>{m.firstPass ? "✓" : "✗"}</td>
                  <td className="num hk-mono">{m.mins}</td>
                  <td className="hk-note">{m.note}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </section>
    </>
  );
}

function Scenarios() {
  const [checks, setChecks] = useState(loadChecks);
  const [scenario, setScenario] = useState("greenfield");

  const toggle = (id) => {
    const next = { ...checks, [id]: !checks[id] };
    setChecks(next);
    saveChecks(next);
  };

  const progressOf = (sc) => {
    const s = SCENARIOS[sc];
    let total = 0,
      done = 0;
    s.phases.forEach((p, pi) =>
      p.items.forEach((_, ii) => {
        total++;
        if (checks[itemId(sc, pi, ii)]) done++;
      })
    );
    return { total, done, pct: total ? Math.round((done / total) * 100) : 0 };
  };

  const scData = SCENARIOS[scenario];
  const prog = progressOf(scenario);

  return (
    <>
      <nav className="hk-tabs hk-tabs-sub">
        {Object.entries(SCENARIOS).map(([key, s]) => {
          const p = progressOf(key);
          return (
            <button
              key={key}
              className={"hk-tab" + (scenario === key ? " active" : "")}
              onClick={() => setScenario(key)}
            >
              <span className="hk-tab-name">{s.label}</span>
              <span className="hk-tab-sub">{s.sub}</span>
              <span className="hk-tab-pct">{p.pct}%</span>
            </button>
          );
        })}
      </nav>

      <section className="hk-progress">
        <div className="hk-ply">
          <div className="hk-ply-fill" style={{ width: prog.pct + "%" }} />
        </div>
        <div className="hk-progress-meta">
          <span>
            {prog.done}/{prog.total} items
          </span>
          <span className="hk-mono">{prog.pct}%</span>
        </div>
      </section>

      <main className="hk-list">
        {scData.phases.map((phase, pi) => {
          const doneInPhase = phase.items.filter((_, ii) => checks[itemId(scenario, pi, ii)]).length;
          return (
            <section key={pi} className="hk-phase">
              <h2 className="hk-phase-head">
                <span>{phase.title}</span>
                <span className="hk-mono hk-phase-count">
                  {doneInPhase}/{phase.items.length}
                </span>
              </h2>
              {phase.items.map((text, ii) => {
                const id = itemId(scenario, pi, ii);
                const on = !!checks[id];
                return (
                  <label key={id} className={"hk-row" + (on ? " done" : "")}>
                    <input type="checkbox" checked={on} onChange={() => toggle(id)} />
                    <span className="hk-row-id hk-mono">
                      {String.fromCharCode(65 + pi)}-{String(ii + 1).padStart(2, "0")}
                    </span>
                    <span className="hk-row-text">{text}</span>
                  </label>
                );
              })}
            </section>
          );
        })}
      </main>
    </>
  );
}

function App() {
  const [tab, setTab] = useState("performance");
  const [showRef, setShowRef] = useState(false);

  return (
    <div className="hk-root">
      <header className="hk-title">
        <div className="hk-title-main">
          <span className="hk-logo">HARNESS&nbsp;KIT</span>
          <span className="hk-title-sub">performance board · built from docs/metrics.md</span>
        </div>
        <div className="hk-stamp">
          <span>sheet 1/1</span>
          <span>{new Date().toISOString().slice(0, 10)}</span>
        </div>
      </header>

      <nav className="hk-tabs">
        <button
          className={"hk-tab" + (tab === "performance" ? " active" : "")}
          onClick={() => setTab("performance")}
        >
          <span className="hk-tab-name">Performance</span>
          <span className="hk-tab-sub">real dev metrics</span>
        </button>
        <button
          className={"hk-tab" + (tab === "scenarios" ? " active" : "")}
          onClick={() => setTab("scenarios")}
        >
          <span className="hk-tab-name">Scenarios</span>
          <span className="hk-tab-sub">setup checklist (reference)</span>
        </button>
      </nav>

      {tab === "performance" ? <Performance data={METRICS_DATA} /> : <Scenarios />}

      <section className="hk-ref">
        <button className="hk-ref-toggle" onClick={() => setShowRef(!showRef)}>
          {showRef ? "Hide invariants" : "Show the 6 invariants"}
        </button>
        {showRef && (
          <ol className="hk-inv">
            {INVARIANTS.map((t, i) => (
              <li key={i}>{t}</li>
            ))}
          </ol>
        )}
      </section>

      <footer className="hk-foot">
        Built from docs/metrics.md — rebuild with ./build/dashboard.sh after logging new entries.
        Checklist progress persists in this browser only.
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
<script>
  /* Transform + run the JSX above manually, instead of relying on Babel
     Standalone's own <script type="text/babel"> auto-scan: recent versions
     of that scanner insert the transformed code as type="module", and
     module scripts refuse to run at all from a file:// origin ("file: URLs
     are treated as unique security origins" — a Chrome restriction, not
     something this page's own code triggers). Calling Babel.transform()
     directly and injecting a plain classic script sidesteps that path. */
  (function () {
    var src = document.getElementById("hk-source").textContent;
    /* runtime: "classic" — the default "automatic" runtime compiles JSX to
       calls that need `import ... from "react/jsx-runtime"`, which breaks
       a classic (non-module) script. "classic" compiles to
       React.createElement(...) instead, using the global React from the
       CDN script — no import needed. */
    var out = Babel.transform(src, { presets: [["react", { runtime: "classic" }]] }).code;
    var s = document.createElement("script");
    s.textContent = out;
    document.body.appendChild(s);
  })();
</script>
</body>
