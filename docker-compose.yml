services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: kumite
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-psecret", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      target: api
    environment:
      DB_DSN: "root:secret@tcp(mysql:3306)/kumite?parseTime=true"
      REDIS_ADDR: "redis:6379"
      PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12

  worker:
    build:
      context: .
      target: worker
    environment:
      DB_DSN: "root:secret@tcp(mysql:3306)/kumite?parseTime=true"
      REDIS_ADDR: "redis:6379"
      PROCESSING_TIMEOUT: "10m"
      # Optional motion-detection tuning; unset defaults to 32px grid cells.
      # MOTION_GRID_CELL_PX: "32"
      # Optional motion-detection tuning; unset defaults to 15.0 per-pair luma threshold.
      # MOTION_THRESHOLD_PER_PAIR: "15.0"
      # Optional motion-detection tuning; unset defaults to 2 minimum connected cells per region.
      # MOTION_MIN_REGION_CELLS: "2"
      # Optional participant cap; unset defaults to 2 top-scoring regions kept.
      # MAX_PARTICIPANTS: "2"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      target: web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8081:80"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 12
